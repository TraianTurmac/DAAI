<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DAAI · Portfolio & Staffing</title>
<style>
:root{
  --bp-red:#FF4047; --deep:#330000;
  --r70:#991F23; --r60:#CC2A35; --r40:#FF7A80; --r20:#FFBDC0;
  --g60:#8B7B74; --g40:#B2A39F; --g30:#CCC1BC; --g20:#E6DEDA; --g10:#FAF8F7;
  --p50:#9E6CFF; --p10:#E6D6FF;
  --success:#2FC46B; --warning:#FFCC14; --error:#FF3B3B; --focus:#A070FF;
  --glass:rgba(255,255,255,.42); --glassHi:rgba(255,255,255,.75);
  --gborder:rgba(255,255,255,.55); --veil:rgba(255,255,255,.18);
  --txt:#0A0A0A; --muted:rgba(0,0,0,.62); --line:rgba(0,0,0,.10); --strong:#000; --inv:#fff;
  --soft:rgba(255,255,255,.35); --surface:rgba(255,255,255,.55);
  --shadow:0 8px 32px rgba(0,0,0,.18);
}
html[data-theme="dark"]{
  --glass:rgba(22,22,28,.42); --glassHi:rgba(255,255,255,.22);
  --gborder:rgba(255,255,255,.16); --veil:rgba(0,0,0,.45);
  --txt:#FFFFFF; --muted:rgba(255,255,255,.66); --line:rgba(255,255,255,.12); --strong:#fff; --inv:#000;
  --soft:rgba(255,255,255,.07); --surface:rgba(30,30,36,.72);
  --shadow:0 8px 32px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;font-family:'FS Albert Pro',Aptos,'Segoe UI',-apple-system,BlinkMacSystemFont,Arial,sans-serif;color:var(--txt);font-size:14px;-webkit-font-smoothing:antialiased;background:#0b1a26}
#bgimg{position:fixed;inset:0;z-index:-2;background-color:#0b1a26;background-repeat:no-repeat;background-position:center center;background-size:cover}
#bgveil{position:fixed;inset:0;z-index:-1;background:var(--veil);transition:background .3s}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.display{font-family:'BearingPoint Sans','FS Albert Pro',Aptos,'Segoe UI',Arial,sans-serif}

.kpi,.card,.navseg,table,.gantt,.sheet,.empty,input,select,textarea,.btn.ghost,.ctl,.spot{
  background:var(--glass);
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  border:1px solid var(--gborder);
  box-shadow:var(--shadow),inset 0 1px 0 var(--glassHi),inset 0 -1px 0 rgba(255,255,255,.05);
}
.kpi,.card,.navseg,table,.gantt,.sheet,.empty{border-radius:18px}

.wrap{max-width:1180px;margin:0 auto;padding:34px 28px 80px}
.top{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px}
.top h1{margin:0;font-size:36px;font-weight:700;letter-spacing:-.6px;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.top .sub{margin:6px 0 0;color:rgba(255,255,255,.85);font-size:13.5px;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.spacer{flex:1}
.ctls{display:flex;gap:8px;align-items:center}
.ctl{border-radius:999px;display:inline-flex;align-items:center;padding:3px;gap:2px;color:var(--txt)}
.ctl button{background:none;border:none;color:var(--txt);font:inherit;font-size:11.5px;font-weight:700;letter-spacing:.8px;padding:6px 10px;border-radius:999px;cursor:pointer}
.ctl button.on{background:var(--strong);color:var(--inv)}
.ctl .ic{width:30px;height:30px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.ctl svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.symbol{font-family:'BearingPoint Sans','FS Albert Pro','Segoe UI',Arial,sans-serif;font-weight:700;font-size:64px;line-height:.8;color:rgba(255,255,255,.75);letter-spacing:-2px;margin-left:12px;user-select:none}
.symbol sup{font-size:.5em;vertical-align:.72em;margin-left:2px}

.navseg{display:grid;grid-template-columns:repeat(5,1fr);padding:7px;gap:6px;margin-bottom:22px}
.navseg button{background:none;border:none;color:var(--txt);font:inherit;font-size:14px;font-weight:600;padding:10px;border-radius:12px;cursor:pointer;transition:background .2s}
.navseg button:hover{background:var(--soft)}
.navseg button.active{background:var(--bp-red);color:#000;box-shadow:0 4px 18px rgba(255,64,71,.45)}

.btn{background:var(--bp-red);border:1px solid var(--bp-red);color:#000;padding:10px 20px;border-radius:12px;cursor:pointer;font:inherit;font-size:13.5px;font-weight:700;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{color:var(--txt);border-radius:12px}
.btn.ghost:hover{background:var(--glassHi)}
.btn.danger{background:transparent;color:var(--txt);border:1px solid var(--line)}
.btn.danger:hover{border-color:var(--error)}
.btn.sm{padding:6px 12px;font-size:12px;border-radius:10px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.kpi{padding:14px 16px 16px}
.kpi small{font-size:12px;color:var(--muted);font-weight:600}
.kpi b{display:block;font-size:30px;font-weight:500;margin-top:10px;line-height:1}
.kpi.alert{cursor:pointer}
.kpi.alert:hover{background:var(--glassHi)}
.kpi.alert.on{outline:2px solid var(--bp-red)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
input,select,textarea{color:var(--txt);padding:10px 12px;border-radius:12px;font:inherit;font-size:14px;box-shadow:none}
input::placeholder{color:var(--muted)}
select option{color:#000}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--bp-red)}
html[data-theme="dark"] input[type=date]{color-scheme:dark}
.toolbar.flt{flex-wrap:nowrap}
.toolbar.flt select{max-width:190px;min-width:0;padding:8px 10px;font-size:13px;flex:0 1 auto}
.toolbar.flt .ed{flex:none}

/* Spotlight search: lupă care se extinde pe toată zona liberă */
.spotz{flex:1 1 auto;min-width:44px;display:flex;justify-content:flex-end}
.spot{position:relative;height:40px;width:44px;border-radius:999px;display:flex;align-items:center;overflow:hidden;cursor:pointer;
  transition:width .38s cubic-bezier(.2,.8,.2,1),border-color .2s,background .2s}
.spot:hover{background:var(--glassHi)}
.spot .mg{position:absolute;left:0;top:0;width:42px;height:38px;display:flex;align-items:center;justify-content:center;background:none;border:none;color:var(--txt);cursor:pointer;padding:0}
.spot .mg svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.2}
.spot input{background:transparent!important;border:none!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;
  width:100%;height:100%;padding:0 74px 0 42px;font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .2s .1s;border-radius:0}
.spot .kb{position:absolute;right:12px;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;opacity:0;transition:opacity .2s}
.spot .clr{position:absolute;right:10px;background:var(--soft);border:none;color:var(--txt);width:22px;height:22px;border-radius:50%;cursor:pointer;display:none;font-size:12px}
.spot.open{width:100%;cursor:text;border-color:var(--bp-red);background:var(--glassHi);box-shadow:var(--shadow),0 0 0 4px rgba(255,64,71,.18)}
.spot.open input{opacity:1;pointer-events:auto}
.spot.open .kb{opacity:1}
.spot.open.has .kb{display:none}
.spot.open.has .clr{display:block}
.spot.has:not(.open){border-color:var(--bp-red)}
.spot.has:not(.open)::after{content:"";position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--bp-red)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{padding:12px 14px;display:flex;flex-direction:column;gap:5px;transition:transform .2s,background .2s;cursor:pointer}
.card:hover{transform:translateY(-2px);background:var(--glassHi)}
.card h3{margin:0;font-size:15px;line-height:1.2;font-weight:700}
.card .tag{font-size:10px}
.cl{font-size:12.5px;color:var(--txt)}
.cl.muted{color:var(--muted)}
.code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-weight:700;font-size:12px}
.roles{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.roles .chip{font-size:10.5px}
.card .acts{margin-top:4px}
.card .acts .btn.sm{padding:4px 11px;font-size:11.5px}

.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.between{justify-content:space-between}
.tag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;color:var(--txt)}
.tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--g40)}
.t-activ::before{background:var(--success)} .t-semnare::before{background:#3FA9F5} .t-negociere::before{background:var(--warning)}
.t-propunere::before{background:var(--p50)} .t-pierdut::before{background:var(--error)}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--strong);border-radius:4px}
.chip{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;background:var(--soft);border:1px solid var(--line)}
.chip.open{border:1px solid var(--bp-red);font-weight:700}
.chip.warn{border-color:var(--warning);font-weight:700}
.req{color:var(--muted);font-size:12.5px;line-height:1.5;margin-top:4px}
.acts{display:flex;gap:6px}

.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:14px;align-items:baseline}
.kv dt{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.8px;font-weight:700}
.kv dd{margin:0}
.dtab{box-shadow:none;border-radius:12px}
.dtab td,.dtab th{font-size:12.5px;padding:8px 10px}
.dh{margin:18px 0 8px;font-size:14px}

table{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden}
th,td{padding:11px 12px;text-align:left;font-size:13.5px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
th{font-size:11px;text-transform:uppercase;letter-spacing:1px;font-weight:700;color:var(--muted)}
tbody tr:hover{background:var(--soft)}
.util{display:flex;align-items:center;gap:10px;min-width:120px}
.util .bar{flex:1}
.u-low>i{background:var(--warning)!important} .u-ok>i{background:var(--success)!important} .u-over>i{background:var(--error)!important}

.gantt{padding:14px 16px;overflow-x:auto}
.gline{display:grid;grid-template-columns:190px 1fr 130px;gap:16px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);min-width:840px}
.gline:last-child{border-bottom:none}
.gline.np{grid-template-columns:190px 1fr}
.track{position:relative;height:30px;background:var(--soft);border-radius:8px;overflow:hidden}
.sg{position:absolute;height:100%;display:flex;align-items:center;padding:0 8px;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;border-radius:7px;border:1px solid rgba(255,255,255,.4)}
.lv{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,rgba(0,0,0,.6) 0 3px,rgba(255,255,255,.4) 3px 7px);border-left:2px solid var(--strong);border-right:2px solid var(--strong);z-index:3}
.todayl{position:absolute;top:0;bottom:0;width:2px;background:var(--bp-red);z-index:4;box-shadow:0 0 8px var(--bp-red)}
.months{display:grid;grid-template-columns:190px 1fr 130px;gap:16px;margin-bottom:4px;min-width:840px}
.months.np{grid-template-columns:190px 1fr}
.mrow{display:grid;grid-template-columns:repeat(12,1fr);font-size:10.5px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.mrow.heat div{font-size:10px;padding:2px 0;margin:0 1px;border-radius:4px;letter-spacing:0;color:#000;font-weight:600}
.yu{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:3px;text-align:right}
.yu b{display:inline-block;font-size:22px;line-height:1.1;padding-bottom:4px;margin-bottom:4px}
.yu .pill{line-height:1.3;white-space:nowrap}
h2.sec{font-size:20px;margin:26px 0 12px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.4)}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;padding:48px 16px;z-index:100;overflow:auto}
.modal.show{display:flex}
.sheet{background:var(--surface);width:100%;max-width:820px;padding:26px 28px;color:var(--txt)}
.sheet h2{margin:0 0 16px;font-size:22px}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.f label{font-size:11.5px;font-weight:700;color:var(--muted)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px} .f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.rolebox,.lvbox{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--soft)}
.empty{color:var(--muted);text-align:center;padding:36px}
.pill{font-size:12px;color:var(--muted)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:rgba(255,255,255,.85);margin-top:12px;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.dot{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-2px;border-radius:3px}
code{background:var(--soft);padding:1px 6px;border-radius:5px;font-size:12px}
.imp-note{font-size:13px;color:var(--muted);line-height:1.6}
.bggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.bgopt{aspect-ratio:16/9;border-radius:12px;border:2px solid transparent;background:#333 center/cover;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--txt)}
.bgopt.on{border-color:var(--bp-red)}
.bgopt.up{background:var(--soft);border:1px dashed var(--line)}

body:not(.editor) .ed{display:none!important}
.authb{display:inline-flex!important;align-items:center;gap:6px;padding:6px 12px!important}
.authb svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
body.editor .authb{background:var(--bp-red)!important;color:#000!important}
.lbl{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#fff;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.lbl input{padding:7px 10px;font-size:13px}
mark{background:var(--warning);color:#000;border-radius:3px;padding:0 2px}
.sk{max-width:260px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.g2 h2.sec{margin-top:4px}
tr.clk{cursor:pointer}
.chl{margin:0;padding-left:16px;font-size:12.5px}
.dhist{margin-top:16px}
.dhist summary{font-size:12px;color:var(--muted);cursor:pointer}
.hist{margin-top:8px;display:flex;flex-direction:column;gap:8px;max-height:220px;overflow:auto}
.hist ul{margin:2px 0 0;padding-left:18px;font-size:12.5px}
.tltabs{display:inline-flex;gap:4px;padding:5px;margin-bottom:14px;border-radius:14px;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--gborder);box-shadow:var(--shadow)}
.tltabs button{background:none;border:none;color:var(--txt);font:inherit;font-size:14px;font-weight:600;padding:9px 26px;border-radius:10px;cursor:pointer}
.tltabs button:hover{background:var(--soft)}
.tltabs button.on{background:var(--bp-red);color:#000;box-shadow:0 4px 14px rgba(255,64,71,.4)}
.holpanel{margin-top:16px;padding:14px 16px;border-radius:18px;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--gborder);box-shadow:var(--shadow);color:var(--txt)}
.holpanel .hd{font-size:12.5px}
.holpanel .hd.past{opacity:.55}
.holpanel .hd.we b{color:var(--muted)}
.cur+.cur{margin-top:6px}
.cur b{font-size:13.5px}
.more{margin-top:3px;font-style:italic}
.pkpi{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}
.pkpi>div{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.pkpi small{display:block;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.pkpi b{display:block;font-size:22px;margin:4px 0 6px}
.pheat{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-bottom:4px}
.pheat div{border-radius:6px;text-align:center;font-size:11px;font-weight:700;color:#000;padding:4px 0}
.pheat span{display:block;font-size:9.5px;font-weight:600;opacity:.65;text-transform:uppercase}
.dtab tr.dim td{opacity:.55}
.chip.dimc{opacity:.55}
@media(max-width:700px){.pkpi{grid-template-columns:1fr 1fr}}
.holi{margin-top:10px;color:rgba(255,255,255,.88);font-size:12px;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.holi summary{color:inherit;cursor:pointer}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 16px;margin-top:6px}
#printArea{display:none}
@media print{
  @page{size:A4 landscape;margin:12mm}
  body{background:#fff!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;color:#000;font-family:Aptos,'Segoe UI',Arial,sans-serif;font-size:10.5px}
  #printArea header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:10px}
  #printArea h1{font-size:20px;margin:0}
  #printArea .ps{font-weight:700;font-size:16px}
  #printArea h2{font-size:13px;margin:14px 0 6px;border-left:3px solid #FF4047;padding-left:6px;break-after:avoid}
  #printArea table{width:100%;border-collapse:collapse;background:#fff!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;box-shadow:none!important;border:none!important;border-radius:0!important;margin-bottom:6px}
  #printArea th{background:#000!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:9.5px;padding:4px 6px;text-align:left}
  #printArea td{border-bottom:1px solid #ccc;padding:3px 6px;font-size:9.5px;color:#000}
  #printArea tr{break-inside:avoid}
  #printArea .pm{color:#555;font-size:9.5px}
}
@media(max-width:900px){.g2{grid-template-columns:1fr}.navseg{grid-template-columns:repeat(3,1fr)}.toolbar.flt{flex-wrap:wrap}.spotz{flex-basis:100%}}
@media(max-width:800px){.wrap{padding:20px 14px}.top h1{font-size:26px}.symbol{display:none}.f2,.f3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="bgimg"></div><div id="bgveil"></div>
<div class="wrap">
  <div class="top">
    <div><h1 class="display">DAAI · Portfolio &amp; Staffing</h1><p class="sub" id="hS"></p></div>
    <div class="spacer"></div>
    <div class="ctls">
      <div class="ctl"><button class="authb" id="authBtn"></button></div>
      <div class="ctl" id="langSw"><button data-l="ro">RO</button><button data-l="en">EN</button></div>
      <div class="ctl"><button class="ic" id="themeBtn"></button></div>
    </div>
    <div class="symbol" aria-label="BearingPoint">B<sup>°</sup></div>
  </div>
  <nav class="navseg">
    <button data-v="projects" class="active" data-i="nav.projects"></button>
    <button data-v="open" data-i="nav.open"></button>
    <button data-v="people" data-i="nav.people"></button>
    <button data-v="timeline" data-i="nav.timeline"></button>
    <button data-v="reports" data-i="nav.reports"></button>
  </nav>
  <section id="v-projects"></section>
  <section id="v-open" hidden></section>
  <section id="v-people" hidden></section>
  <section id="v-timeline" hidden></section>
  <section id="v-reports" hidden></section>
</div>
<input type="file" id="fileBulk" accept=".csv,.json,.txt" hidden />
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div id="printArea"></div>
<script>
/* ---------------- i18n ---------------- */
let LANG=localStorage.getItem('bp-lang')||'ro';
const I={
 ro:{'nav.projects':'Proiecte','nav.open':'Poziții deschise','nav.people':'Echipă','nav.timeline':'Timeline','nav.reports':'Rapoarte',
  'btn.import':'Import','bg':'Fundal','bg.default':'Implicit','btn.edit':'Editează','btn.del':'Șterge','btn.assign':'Alocă','btn.close':'Închide',
  'btn.save':'Salvează','btn.cancel':'Anulează','btn.newProj':'+ Proiect nou','btn.newPerson':'+ Membru nou','btn.addRole':'+ Adaugă rol','btn.delRole':'Șterge rol',
  'btn.addLeave':'+ Adaugă concediu','btn.tpl':'Descarcă template CSV','btn.pick':'Alege fișier…',
  'hero.projects':'Status, cod proiect, client, perioadă și roluri. Click pe card pentru detalii.',
  'hero.open':'Roluri neacoperite, cerințe și colegi cu capacitate disponibilă.',

function migrateP(p){
  p.roles=p.roles||[];
  if(p.code==null){const m=(p.note||'').match(/ID (\d+)/);p.code=m?m[1]:'';if(m)p.note=p.note.replace(/ID \d+ · /,'');}
  if(p.tech==null){const n=p.note||'',s=new Set();
    const m=n.match(/Stack: ([^·]+)/);if(m)m[1].split('|').forEach(x=>s.add(normTech(x)));

}

/* ---------------- Sărbători legale RO + helpers ---------------- */
function orthodoxEaster(y){const a=y%4,b=y%7,c=y%19,d=(19*c+15)%30,e=(2*a+4*b-d+34)%7;const m=Math.floor((d+e+114)/31),day=((d+e+114)%31)+1;const r=new Date(y,m-1,day);r.setDate(r.getDate()+13);return r;}
function ymdL(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const _hol={};
function roHolidays(y){
  if(_hol[y])return _hol[y];
  const M=new Map();const add=(d,n)=>{const k=ymdL(d);M.set(k,M.has(k)&&!M.get(k).includes(n)?M.get(k)+' / '+n:(M.get(k)||n));};
  [[0,1,'Anul Nou'],[0,2,'Anul Nou'],[0,6,'Boboteaza'],[0,7,'Sf. Ioan'],[0,24,'Unirea Principatelor'],[4,1,'Ziua Muncii'],[5,1,'Ziua Copilului'],[7,15,'Adormirea Maicii Domnului'],[10,30,'Sf. Andrei'],[11,1,'Ziua Națională'],[11,25,'Crăciunul'],[11,26,'Crăciunul']]
    .forEach(([m,d,n])=>add(new Date(y,m,d),n));
  const E=orthodoxEaster(y),off=(k,n)=>{const d=new Date(E);d.setDate(d.getDate()+k);add(d,n);};
  off(-2,'Vinerea Mare');off(0,'Paștele');off(1,'Paștele');off(49,'Rusaliile');off(50,'Rusaliile');
  _hol[y]={list:[...M].map(([d,name])=>({d,name})).sort((a,b)=>a.d.localeCompare(b.d)),set:new Set(M.keys())};return _hol[y];
}
const isWeekday=d=>d.getDay()!==0&&d.getDay()!==6;
const isHoliday=d=>roHolidays(d.getFullYear()).set.has(ymdL(d));
const isWorkday=d=>isWeekday(d)&&!isHoliday(d);
const fmt=d=>d?new Date(d).toLocaleDateString(LANG==='en'?'en-GB':'ro-RO',{day:'2-digit',month:'short',year:'numeric'}):'—';
const fmtTs=s=>new Date(s).toLocaleString(LANG==='en'?'en-GB':'ro-RO',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
const D=s=>{const d=new Date(s);d.setHours(0,0,0,0);return d;};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};
const overlaps=(s,e,a,b)=>D(s)<=D(b)&&D(e)>=D(a);
const isActiveNow=(s,e)=>{const x=today();return D(s)<=x&&D(e)>=x;};
function allocationsOf(name){
  const out=[];
  DB.projects.forEach(p=>{if(p.status==='Pierdut')return;
    p.roles.forEach(r=>(r.assigned||[]).forEach(a=>{if(a===name)out.push({project:p,role:r,start:r.start||p.start,end:r.end||p.end,alloc:+r.alloc||0,weighted:(+r.alloc||0)*(+p.prob||0)/100});}));});
  return out;
}
function onLeave(pe,d){return (pe?.leaves||[]).some(l=>D(l.start)<=d&&D(l.end)>=d);}
function utilNow(name){return allocationsOf(name).filter(a=>isActiveNow(a.start,a.end)&&CONFIRMED.includes(a.project.status)).reduce((s,a)=>s+a.alloc,0);}
function pipelineNow(name){return allocationsOf(name).filter(a=>['Negociere','Propunere','În semnare'].includes(a.project.status)).reduce((s,a)=>s+a.weighted,0);}
function utilPeriod(pe,from,to){
  const al=allocationsOf(pe.name).filter(a=>overlaps(a.start,a.end,from,to));
  let work=0,leave=0,sum=0,sumW=0;
  for(let d=new Date(from);d<=to;d.setDate(d.getDate()+1)){
    if(!isWorkday(d))continue;work++;
    if(onLeave(pe,d)){leave++;continue;}
    al.forEach(a=>{if(D(a.start)<=d&&D(a.end)>=d){if(CONFIRMED.includes(a.project.status))sum+=a.alloc;sumW+=a.weighted;}});
  }
  const avail=work-leave;
  return {work,leave,avail,u:avail?Math.round(sum/avail):0,uw:avail?Math.round(sumW/avail):0};
}
const utilClass=u=>u<80?'u-low':(u>100?'u-over':'u-ok');
const heatBg=u=>u===0?'rgba(255,255,255,.35)':u<80?'#FFF0B8':u>100?'var(--r20)':'#CDEBD9';
function openRoles(){
  const out=[];
  DB.projects.forEach(p=>{if(['Pierdut','Finalizat'].includes(p.status))return;
    p.roles.forEach(r=>{const open=Math.max(0,(+r.seats||0)-(r.assigned||[]).length);if(open>0)out.push({p,r,open});});});
  return out;
}

function capOn(pe,d){
  if(!isWorkday(d)||onLeave(pe,d))return 0;
  const used=allocationsOf(pe.name).filter(a=>CONFIRMED.includes(a.project.status)&&D(a.start)<=d&&D(a.end)>=d).reduce((s,a)=>s+a.alloc,0);
  return Math.max(0,100-used);
}
function freeFrom(pe){const d=today();for(let i=0;i<450;i++){if(isWorkday(d)&&!onLeave(pe,d)&&capOn(pe,d)>0)return {d:new Date(d),cap:capOn(pe,d),now:i===0};d.setDate(d.getDate()+1);}return null;}

    (al.length>cur.length?`<div class="pill more">+${al.length-cur.length} ${t('moreAlloc')}</div>`:'');
  const nx=al.filter(a=>D(a.start)>td).sort((a,b)=>D(a.start)-D(b.start))[0];

/* ---------------- View: Timeline ---------------- */
let gYear=new Date().getFullYear(),tlMode='conf',tlTab=localStorage.getItem('daai-tltab')||'proj';
const segStyle=s=>({'Activ':'background:var(--r70);color:#fff','În semnare':'background:var(--r40);color:#000','Negociere':'background:var(--g30);color:#000',
  'Propunere':'background:var(--p10);color:#000','Pierdut':'background:var(--g40);color:#000'})[s]||'background:var(--g20);color:#000';
function renderTimeline(){
  const el=document.getElementById('v-timeline');
  const y0=new Date(gYear,0,1),y1=new Date(gYear,11,31),span=y1-y0+864e5;
  const pos=(s,e)=>{const a=Math.max(D(s),y0),b=Math.min(D(e),y1);if(b<a)return null;return {left:(a-y0)/span*100,w:Math.max(.6,(b-a+864e5)/span*100)};};
  const months=t('months');
  const td=today(),tl=(td>=y0&&td<=y1)?`<div class="todayl" style="left:${(td-y0)/span*100}%"></div>`:'';
  const mhead=np=>`<div class="months ${np?'np':''}"><div></div><div class="mrow">${months.map(m=>`<div>${m}</div>`).join('')}</div>${np?'':`<div class="pill" style="text-align:right">${t('yearUtil')}</div>`}</div>`;
  const peopleRows=DB.people.map(pe=>{
    const al=allocationsOf(pe.name).filter(a=>overlaps(a.start,a.end,y0,y1));
    const lanes=[];al.sort((a,b)=>D(a.start)-D(b.start)).forEach(a=>{let i=lanes.findIndex(L=>D(L[L.length-1].end)<D(a.start));if(i<0){lanes.push([]);i=lanes.length-1;}lanes[i].push(a);a.lane=i;});
    const n=Math.max(1,lanes.length),h=100/n;
    const segs=al.map(a=>{const p=pos(a.start,a.end);if(!p)return'';
      return `<div class="sg" style="left:${p.left}%;width:${p.w}%;top:${a.lane*h}%;height:${h}%;${segStyle(a.project.status)};opacity:${CONFIRMED.includes(a.project.status)?1:.75}" title="${esc(a.project.name)} · ${esc(a.role.title)} · ${a.alloc}% · ${fmt(a.start)} → ${fmt(a.end)}">${esc(a.project.name)} · ${a.alloc}%</div>`;}).join('');
    const lvs=(pe.leaves||[]).map(l=>{const p=pos(l.start,l.end);if(!p)return'';
      return `<div class="lv" style="left:${p.left}%;width:${p.w}%" title="${esc(tL(l.type))}: ${fmt(l.start)} → ${fmt(l.end)}"></div>`;}).join('');
    const yr=utilPeriod(pe,y0,y1),um=tlMode==='conf'?yr.u:yr.uw;
    const heat=months.map((m,i)=>{const r=utilPeriod(pe,new Date(gYear,i,1),new Date(gYear,i+1,0));const v=tlMode==='conf'?r.u:r.uw;
      return `<div style="background:${heatBg(v)}" title="${m}: ${v}% · ${r.leave} ${t('leaveDays')}">${v}%</div>`;}).join('');
    return `<div class="gline">
      <div><b style="font-size:13px">${esc(pe.name)}</b><div class="pill">${esc(pe.position||'')}</div></div>
      <div><div class="track" style="height:${Math.max(30,n*22)}px">${segs}${lvs}${tl}</div><div class="mrow heat" style="margin-top:3px">${heat}</div></div>
      <div class="yu"><b style="border-bottom:3px solid ${um>100?'var(--error)':um<80?'var(--warning)':'var(--success)'}">${um}%</b><span class="pill">${yr.leave} ${t('leaveDays')}</span><span class="pill">${yr.avail}/${yr.work} ${t('availDays')}</span></div>
    </div>`;
  }).join('');
  const hol=roHolidays(gYear).list;
  el.innerHTML=`
    <div class="toolbar">
      <button class="btn ghost sm" id="py">← ${gYear-1}</button><b class="display" style="font-size:22px;margin:0 6px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.4)">${gYear}</b><button class="btn ghost sm" id="ny">${gYear+1} →</button>
      <div class="spacer"></div>
      <span class="pill" style="color:#fff">${t('calc')}</span>
      <select id="tlm"><option value="conf" ${tlMode==='conf'?'selected':''}>${t('calc.conf')}</option><option value="w" ${tlMode==='w'?'selected':''}>${t('calc.w')}</option></select>
    </div>
    <div class="tltabs" role="tablist">
      <button class="${tlTab==='proj'?'on':''}" data-tl="proj">${t('tl.proj')}</button>
      <button class="${tlTab==='res'?'on':''}" data-tl="res">${t('tl.res')}</button>
    </div>
    ${tlTab==='proj'?`<div class="gantt">${mhead(true)}
      ${DB.projects.map(p=>{const ps=pos(p.start,p.end);return `<div class="gline np">
        <div><b style="font-size:13px">${esc(p.name)}</b><div class="pill">${tag(p.status)}</div></div>
        <div class="track">${ps?`<div class="sg" style="left:${ps.left}%;width:${ps.w}%;${segStyle(p.status)}">${fmt(p.start)} → ${fmt(p.end)}</div>`:''}${tl}</div></div>`;}).join('')}
    </div>`:`<div class="gantt">${mhead(false)}${peopleRows}</div>`}
    <div class="legend">
      ${['Activ','În semnare','Negociere','Propunere'].map(s=>`<span><i class="dot" style="${segStyle(s)}"></i>${tS(s)}</span>`).join('')}
      ${tlTab==='res'?`<span><i class="dot" style="background:repeating-linear-gradient(45deg,#000 0 2px,#ccc 2px 4px)"></i>${t('lg.leave')}</span>`:''}
      <span><i class="dot" style="background:var(--bp-red);width:3px"></i>${t('lg.today')}</span>
      ${tlTab==='res'?`<span>${t('lg.formula')}</span>`:''}
    </div>
    <div class="holpanel">
      <div class="row between" style="margin-bottom:8px"><b class="display" style="font-size:15px">${t('hol')} ${gYear}</b>
        <span class="pill">${hol.filter(h=>isWeekday(new Date(h.d))).length} ${t('holEx')} · ${t('holNote')}</span></div>
      <div class="hgrid">${hol.map(h=>{const d=new Date(h.d),we=!isWeekday(d),past=D(h.d)<today();
        return `<span class="hd ${we?'we':''} ${past?'past':''}"><b>${fmt(h.d)}</b> · ${esc(h.name)}${we?` <i class="pill">(${t('weekend')})</i>`:''}</span>`;}).join('')}</div>
    </div>`;
  el.querySelectorAll('[data-tl]').forEach(b=>b.onclick=()=>{tlTab=b.dataset.tl;localStorage.setItem('daai-tltab',tlTab);renderTimeline();});
  document.getElementById('py').onclick=()=>{gYear--;renderTimeline();};
  document.getElementById('ny').onclick=()=>{gYear++;renderTimeline();};
  document.getElementById('tlm').onchange=e=>{tlMode=e.target.value;renderTimeline();};
}

function parseCSV(text){
  text=text.replace(/^\ufeff/,'');
  const first=text.split(/\r?\n/)[0];
  const sep=(first.split(';').length>=first.split(',').length)?';':',';
  const rows=[];let row=[],cur='',qt=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(qt){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else qt=false;}else cur+=c;}
    else if(c==='"')qt=true;else if(c===sep){row.push(cur);cur='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur='';}
    else cur+=c;}
  if(cur||row.length){row.push(cur);rows.push(row);}
  const head=rows.shift().map(h=>h.trim().toLowerCase());
  return rows.filter(r=>r.some(x=>x.trim())).map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]||'').trim()])));
}
function normDate(s){if(!s)return'';s=s.trim();
  let m=s.match(/^(\d{1,2})[./](\d{1,2})[./](\d{4})$/);if(m)return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  const d=new Date(s);return isNaN(d)?'':ymdL(d);}
const normStatus=s=>STATUSES.includes(s)?s:(ST_EN[(s||'').toLowerCase()]||((s||'').toLowerCase().includes('propunere')?'Propunere':'Propunere'));
function rowsToProjects(rows){

    if(!map.has(name))map.set(name,{id:uid(),code:r.cod||r.code||r['project id']||'',name,client:r.client||'',status:normStatus(r.status),prob:+(r.probabilitate||r.probability||r.prob||0),
      start:normDate(r.start),end:normDate(r.end),note:r.nota||r.note||'',tech:uniq((r.tehnologii||r.technologies||r.tech||'').split(/[,|]/).map(normTech)),roles:[]});
    const p=map.get(name);const title=r.rol||r.role;
    if(title)p.roles.push({id:uid(),title,seats:+(r.pozitii||r.seats||1)||1,alloc:+(r.alocare||r.allocation||r.alloc||100),
      start:normDate(r.start_rol||r.role_start),end:normDate(r.end_rol||r.role_end),req:r.cerinte||r.requirements||r.req||'',
      assigned:(r.propusi||r.assigned||'').split(',').map(s=>s.trim()).filter(Boolean)});});
  return [...map.values()];
}

function diffProject(a,b){
  const ch=[],v=x=>x===''||x==null?'—':x;
  [['name','f.name'],['code','f.code'],['client','f.client'],['status','f.status'],['prob','f.prob'],['start','f.start'],['end','f.end']]
    .forEach(([k,l])=>{if(String(a[k]??'')!==String(b[k]??''))ch.push(`${t(l)}: ${v(k==='status'?tS(a[k]):a[k])} → ${v(k==='status'?tS(b[k]):b[k])}`);});
  if((a.tech||[]).join()!==(b.tech||[]).join())ch.push(`${t('tech')}: ${(a.tech||[]).join(', ')||'—'} → ${(b.tech||[]).join(', ')||'—'}`);
  const om=new Map(a.roles.map(r=>[r.id,r])),nm=new Map(b.roles.map(r=>[r.id,r]));
  b.roles.forEach(r=>{const o=om.get(r.id);
    if(!o){ch.push(`+ ${t('th.role')} ${r.title} (${(r.assigned||[]).join(', ')||'—'}, ${r.alloc}%)`);return;}
    if(o.title!==r.title)ch.push(`${t('th.role')}: ${o.title} → ${r.title}`);
    if(+o.alloc!==+r.alloc)ch.push(`${r.title} · ${t('th.alloc')}: ${o.alloc}% → ${r.alloc}%`);
    if(+o.seats!==+r.seats)ch.push(`${r.title} · ${t('th.seats')}: ${o.seats} → ${r.seats}`);
    const oa=(o.assigned||[]).join(', '),na=(r.assigned||[]).join(', ');if(oa!==na)ch.push(`${r.title} · ${t('th.dev')}: ${oa||'—'} → ${na||'—'}`);
    if((o.start||'')!==(r.start||'')||(o.end||'')!==(r.end||''))ch.push(`${r.title} · ${t('th.period')}: ${v(o.start)} … ${v(o.end)} → ${v(r.start)} … ${v(r.end)}`);
    if((o.req||'')!==(r.req||''))ch.push(`${r.title} · ${t('th.req')}`);});
  a.roles.forEach(r=>{if(!nm.has(r.id))ch.push(`− ${t('th.role')} ${r.title}`);});
  if((a.note||'')!==(b.note||''))ch.push(t('f.note'));
  return ch;
}
function diffPerson(a,b){
  const ch=[],v=x=>x===''||x==null?'—':x;
  [['name','f.pname'],['position','f.position'],['grade','f.grade'],['location','f.loc'],['skills','f.skills']]
    .forEach(([k,l])=>{if(String(a[k]??'')!==String(b[k]??''))ch.push(`${t(l)}: ${v(a[k])} → ${v(b[k])}`);});
  const lv=x=>(x.leaves||[]).map(l=>`${l.start}…${l.end}`).join(', ');
  if(lv(a)!==lv(b))ch.push(`${t('th.leaves')}: ${lv(a)||'—'} → ${lv(b)||'—'}`);
  return ch;
}

  return [...m.values()].map(g=>({...g,people:[...g.people].sort(),clients:[...g.clients].sort(),codes:[...g.codes]}))
    .sort((a,b)=>b.projects.length-a.projects.length||a.key.localeCompare(b.key));

          <td>${g.clients.map(esc).join(', ')}</td><td>${g.people.map(esc).join(', ')||'—'}</td></tr>`).join('')}

      ${hist.map(h=>`<tr><td class="pill" style="white-space:nowrap">${fmtTs(h.ts)}</td><td>${esc(h.user)}</td><td>${t('h.'+h.action)}</td><td><b>${esc(h.name)}</b></td>

      :`<div class="empty">${t('rep.noHist')}</div>`}`;

const CRC_T=(()=>{const a=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;a[n]=c>>>0;}return a;})();
const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC_T[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;};
function zipStore(files){
  const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  files.forEach(f=>{
    const nm=enc.encode(f.name),d=enc.encode(f.data),crc=crc32(d);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(12,0x21,true);
    h.setUint32(14,crc,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nm.length,true);
    parts.push(new Uint8Array(h.buffer),nm,d);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(14,0x21,true);
    c.setUint32(16,crc,true);c.setUint32(20,d.length,true);c.setUint32(24,d.length,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
    cd.push(new Uint8Array(c.buffer),nm);off+=30+nm.length+d.length;
  });
  const cdSize=cd.reduce((s,x)=>s+x.length,0),e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cdSize,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cd,new Uint8Array(e.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
const xesc=s=>String(s??'').replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const colL=i=>{let s='';i++;while(i){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;};
function sheetXML(rows){
  const w=rows[0].map((_,c)=>Math.min(60,Math.max(10,...rows.map(r=>String(r[c]??'').length+2))));
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${w.map((x,i)=>`<col min="${i+1}" max="${i+1}" width="${x}" customWidth="1"/>`).join('')}</cols><sheetData>${rows.map((r,ri)=>`<row r="${ri+1}">${r.map((v,ci)=>{const ref=colL(ci)+(ri+1),st=ri===0?' s="1"':'';return typeof v==='number'&&isFinite(v)?`<c r="${ref}"${st}><v>${v}</v></c>`:`<c r="${ref}" t="inlineStr"${st}><is><t xml:space="preserve">${xesc(v)}</t></is></c>`;}).join('')}</row>`).join('')}</sheetData></worksheet>`;
}
function buildXlsx(sheets){
  const X='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const files=[
    {name:'[Content_Types].xml',data:`${X}<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`},
    {name:'_rels/.rels',data:`${X}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
    {name:'xl/workbook.xml',data:`${X}<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s,i)=>`<sheet name="${xesc(s.name.replace(/[\\\/\?\*\[\]:]/g,' ').slice(0,31))}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`},
    {name:'xl/_rels/workbook.xml.rels',data:`${X}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
    {name:'xl/styles.xml',data:`${X}<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF000000"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`}
  ];
  sheets.forEach((s,i)=>files.push({name:`xl/worksheets/sheet${i+1}.xml`,data:sheetXML(s.rows)}));
  return zipStore(files);
}
function reportSheets(){
  const R=reportData();
  return [{name:t('rep.projects'),rows:R.projects},{name:t('roles'),rows:R.roles},{name:t('nav.people'),rows:R.people},
    {name:`${t('rep.util')} ${R.year}`,rows:R.util},{name:t('nav.open'),rows:R.open},{name:t('rep.byClient'),rows:R.clients},

}

const BGS=['17048MSTeams_BG_14.jpg','66578MSTeams_BG_13.jpg','30381MSTeams_BG_12.jpg','73202MSTeams_BG_11.jpg','12019MSTeams_BG_8.jpg','12264MSTeams_BG_10.jpg',
 '15501MSTeams_BG_9.jpg','86599MSTeams_BG_7.png','8171MSTeams_BG_6.png','78379MSTeams_BG_5.png','13479MSTeams_BG_1.png','16986MSTeams_BG_2.png','75527MSTeams_BG_3.png'];
const BG_KEY='bp-bg-v2';
let BG=localStorage.getItem(BG_KEY)||'default';
const bgUrl=()=>DEFAULT_BG;
function applyBg(){document.getElementById('bgimg').style.backgroundImage=`url("${bgUrl()}")`;}
/* ---------------- Navigare ---------------- */
let view='projects';
function go(v){view=v;document.querySelectorAll('.navseg button').forEach(x=>x.classList.toggle('active',x.dataset.v===v));renderAll();}
document.querySelectorAll('.navseg button').forEach(b=>b.onclick=()=>go(b.dataset.v));
function renderAll(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-i]').forEach(n=>n.textContent=t(n.dataset.i));
  document.querySelectorAll('#langSw button').forEach(b=>b.classList.toggle('on',b.dataset.l===LANG));
  document.getElementById('hS').textContent=t('hero.'+view);
  renderAuth();
  ['projects','open','people','timeline','reports'].forEach(v=>document.getElementById('v-'+v).hidden=v!==view);
  ({projects:renderProjects,open:renderOpen,people:renderPeople,timeline:renderTimeline,reports:renderReports})[view]();
}
document.querySelectorAll('#langSw button').forEach(b=>b.onclick=()=>{LANG=b.dataset.l;localStorage.setItem('bp-lang',LANG);renderAll();});
document.getElementById('themeBtn').onclick=()=>{THEME=THEME==='dark'?'light':'dark';localStorage.setItem('bp-theme',THEME);applyTheme();};
document.getElementById('authBtn').onclick=authDialog;
/* Taste: ⌘/Ctrl+K sau „/” deschid căutarea; Esc închide pop-up-ul */
document.addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'');
  if(((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k')||(e.key==='/'&&!typing)){
    e.preventDefault();closeModal();if(view==='people'){openSpotE();return;}if(view!=='projects')go('projects');openSpot();return;}
  if(e.key==='Escape')closeModal();
});
window.addEventListener('afterprint',()=>{document.getElementById('printArea').innerHTML='';});
applyTheme();applyBg();save();renderAll();
